spring.application.name=travel-plan

# DB연동 세팅!
spring.datasource.url=${DB_URL}
spring.datasource.username=root
spring.datasource.password=${DB_PW}

#JPA 핵심설정
#update
#Update the schema if necessary.
spring.jpa.hibernate.ddl-auto=update

# SQL 정렬
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
# Codex 작성: 제공사별 로그인 설정. 네이버/구글 키가 비어 있어도 서버는 실행되며 로그인 클릭 시 안내합니다.
# 실제 키는 환경변수에 설정합니다. 콜백 주소는 각 개발자 콘솔에도 동일하게 등록해야 합니다.
login.oauth.kakao.client-id=${KAKAO_REST_API_KEY_MACHADAERO:}
login.oauth.kakao.client-secret=${KAKAO_REST_API_SECRET_KEY_MACHADAERO:}
login.oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/login/kakao/callback}
login.oauth.naver.client-id=${NAVER_CLIENT_ID:}
login.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
login.oauth.naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8080/login/naver/callback}
login.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
login.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
login.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/google/callback}

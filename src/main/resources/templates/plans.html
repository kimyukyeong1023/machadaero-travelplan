<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: pageLayout('내 여행계획 - 마차대로', ~{::pageHead}, ~{::main})}"
>
  <head>
    <th:block th:fragment="pageHead">
      <link rel="stylesheet" th:href="@{/css/plans.css}" />
      <!-- Codex 수정: 전체 계획의 분류·정렬·페이징 스크립트 연결 -->
      <script th:src="@{/js/plans.js}" defer></script>
    </th:block>
  </head>
  <body>
    <main class="plans-page">
      <!-- 상단 헤더 영역 -->
      <div class="plan-header-wrapper">
        <div class="plan-header-center">
          <h2>내 여행계획</h2>
          <p>계획을 선택하면 상세 일정을 확인할 수 있습니다.</p>
        </div>
        <button type="button" class="btn-new-plan" onclick="location.href='/plans/new'">+ 새 계획</button>
      </div>

      <!-- Codex 수정: data-filter로 JS에서 분류를 전환합니다. -->
      <div class="plan-tabs">
        <a th:href="@{/plans(filter='all')}"
           data-filter="all">전체</a>
        <a th:href="@{/plans(filter='upcoming')}"
           data-filter="upcoming">예정·진행 중</a>
        <a th:href="@{/plans(filter='past')}"
           data-filter="past">지난 여행</a>
        <a th:href="@{/plans(filter='undated')}"
           data-filter="undated">날짜 미완성</a>
      </div>

      <!-- 리스트 영역 -->
      <div class="plan-list-container">
        <!-- 리스트 헤더 (항목명) -->
        <div class="list-header">
          <span class="col-title">여행계획</span>
          <span class="col-date">여행 기간</span>
          <span class="col-btn">관리</span>
        </div>

        <!-- Codex 수정: 전체 계획을 전달하고, JS가 날짜 속성으로 정렬한 뒤 10개만 표시합니다. -->
        <ul class="plan-list">
          <li class="plan-item" th:each="plan, status : ${planList}" th:hidden="${status.index >= 10}"
              th:attr="data-plan-id=${plan.id},data-start-date=${plan.startDate},data-end-date=${plan.endDate}">
            <div class="col-title"><h3 th:text="${plan.title}">여행계획</h3></div>
            <div class="col-date">
              <span th:text="${plan.startDate != null ? #temporals.format(plan.startDate, 'yyyy. MM. dd') : '날짜 미정'}">날짜 미정</span>
              ~
              <span th:text="${plan.endDate != null ? #temporals.format(plan.endDate, 'yyyy. MM. dd') : '날짜 미정'}">날짜 미정</span>
            </div>
            <div class="col-btn plan-actions">
              <form method="get" th:action="@{/plans/{planId}(planId=${plan.id})}">
                <button type="submit" class="btn-outline">일정 보기 &rarr;</button>
              </form>
              <!-- 수정 화면과 삭제 처리는 해당 컨트롤러 경로 구현이 필요합니다. -->
              <form method="get" th:action="@{/plans/{planId}/edit(planId=${plan.id})}">
                <button type="submit" class="btn-outline">계획 수정</button>
              </form>
              <form
                method="post"
                th:action="@{/plans/{planId}/delete(planId=${plan.id})}"
                onsubmit="return confirm('이 여행계획을 삭제하시겠습니까?');"
              > 
                <button type="submit" class="btn-outline btn-delete-plan">계획 삭제</button>
              </form>
            </div>
          </li>
          <li class="plan-item plans-empty" th:hidden="${!#lists.isEmpty(planList)}">
            <div class="col-title">해당 분류의 여행계획이 없습니다.</div>
          </li>
        </ul>
      </div>

      <!-- Codex 수정: JS가 페이지 번호를 만듭니다. 결과가 없어도 1페이지를 표시합니다. -->
      <nav class="pagination plans-pagination" aria-label="계획 목록 페이지"></nav>
    </main>
  </body>
</html>

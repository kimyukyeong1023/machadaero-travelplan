<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: pageLayout('계획 상세 - 마차대로', ~{::pageHead}, ~{::main})}"
>
  <head>
    <th:block th:fragment="pageHead">
      <link rel="stylesheet" th:href="@{/css/plans.css}" />
    </th:block>
  </head>
  <body>
    <main>
      <!-- 상단 제목 및 컨트롤 영역 -->
      <div class="plan-detail-header">
        <div class="header-left">
          <a th:href="@{/plans}" class="btn-back">&larr; 내 계획 목록</a>
        </div>

        <!-- 컨트롤러에서 넘겨줄 plan 데이터를 임시 텍스트로 대체 -->
        <div class="plan-title-area">
          <h2>제주 여행</h2>
          <p class="plan-date">2026. 09. 20 ~ 2026. 09. 22</p>
        </div>


      </div>

      <!-- 세부 일정(방문 장소) 영역 -->
      <section class="schedule-section">
        <div class="section-heading">
          <h3>전체 일정</h3>
          <!-- 상단 '+ 일정 추가' 버튼 -->
          <button
            type="button"
            class="btn-outline"
            onclick="openScheduleModal()"
          >
            + 일정 추가
          </button>
        </div>

        <div class="schedule-list-container">
          <!-- 리스트 헤더 -->
          <div class="schedule-header list-header">
            <span class="col-order">순서</span>
            <span class="col-s-date">날짜</span>
            <span class="col-place">방문장소</span>
            <span class="col-memo">일정 내용</span>
            <span class="col-manage">관리</span>
          </div>

          <!-- 일정 목록 -->
          <ul class="schedule-list">
            <li class="schedule-item" th:each="planItem : ${planItemList}">
              <span class="col-order" th:text="${planItem.sortOrder}">1</span>
              <span
                class="col-s-date"
                th:text="${planItem.visitDate != null ? #temporals.format(planItem.visitDate, 'MM.dd') : '미정'}"
              >09.20</span>
              <span class="col-place" th:text="${planItem.placeName}">성산일출봉</span>
              <span class="col-memo" th:text="${planItem.memo}">오전 산책</span>
              <div class="col-manage">
                <div class="manage-links">
                  <a href="#">상세</a> &middot;
                  <!-- 리스트 안의 '수정' 버튼 -->
                  <a
                    href="#"
                    th:attr="data-item-id=${planItem.id},
                             data-place-name=${planItem.placeName},
                             data-place-address=${planItem.address},
                             data-visit-date=${planItem.visitDate != null ? #temporals.format(planItem.visitDate, 'yyyy-MM-dd') : ''},
                             data-visit-time=${planItem.visitTime != null ? #temporals.format(planItem.visitTime, 'HH:mm') : ''},
                             data-duration=${planItem.duration},
                             data-memo=${planItem.memo},
                             data-extra-memo=${planItem.extraMemo}"
                    onclick="
                      openScheduleModal(this);
                      return false;
                    "
                  >
                    수정</a
                  >
                  &middot;
                  <form
                    method="post"
                    th:action="@{/plans/{planId}/items/{itemId}/delete(planId=${planId},itemId=${planItem.id})}"
                    onsubmit="return confirm('이 일정을 삭제하시겠습니까?');"
                    style="display: inline;"
                  >
                    <button type="submit" class="btn-outline">삭제</button>
                  </form>
                </div>
                <button type="button" class="btn-move">&uarr;</button>
                <button type="button" class="btn-move">&darr;</button>
              </div>
            </li>
          </ul>
          <p class="help-text-bottom" th:if="${#lists.isEmpty(planItemList)}">
            등록된 일정이 없습니다. 일정을 추가해 주세요.
          </p>
        </div>

        <p class="help-text-bottom">상세·수정은 일정 팝업으로 표시합니다.</p>
      </section>

      <!-- 일정 추가/수정 팝업 (기본적으로 숨김 상태) -->
      <div id="schedule-modal" class="modal-overlay" hidden>
        <div class="modal-content" role="dialog" aria-labelledby="modal-title">
          <div class="modal-header">
            <h2 id="modal-title">일정 추가</h2>
            <button
              type="button"
              class="btn-close"
              onclick="closeScheduleModal()"
              aria-label="닫기"
            >
              &times;
            </button>
          </div>

          <div class="modal-body">
            <div class="plan-badge">제주 여행</div>

            <form
              id="schedule-form"
              class="schedule-form"
              method="post"
              th:action="@{/plans/{planId}/items(planId=${planId})}"
              th:attr="data-plan-id=${planId}"
            >
              <!-- 장소명 -->
              <div class="form-row">
                <label for="placeName" class="row-label">장소명</label>
                <div class="row-input">
                  <input
                    type="text"
                    id="placeName"
                    name="placeName"
                    placeholder="장소명을 입력하세요"
                  />
                </div>
                <div class="row-side">
                  <button type="button" class="btn-outline btn-search-place">
                    관광지에서 추가
                  </button>
                  <p class="field-help">관광지 선택 시 장소명·주소 자동 입력</p>
                </div>
              </div>

              <!-- 주소 -->
              <div class="form-row">
                <label for="placeAddress" class="row-label">주소</label>
                <div class="row-input full-width">
                  <input
                    type="text"
                    id="placeAddress"
                    name="placeAddress"
                    placeholder="주소를 입력하세요"
                  />
                </div>
              </div>

              <!-- 방문일, 방문시간, 소요시간 -->
              <div class="form-row time-row">
                <label for="visitDate" class="row-label">방문일</label>
                <div class="time-inputs">
                  <div class="input-group">
                    <input type="date" id="visitDate" name="visitDate" />
                    <p class="field-help">날짜를 비우면 미정으로 저장됩니다.</p>
                  </div>

                  <label for="visitTime" class="inline-label">방문시간</label>
                  <input type="time" id="visitTime" name="visitTime" />

                  <label for="duration" class="inline-label">소요시간</label>
                  <div class="duration-input">
                    <input
                      type="number"
                      id="duration"
                      name="duration"
                      min="0"
                    />
                    <span>분</span>
                  </div>
                </div>
              </div>

              <!-- 일정 내용 -->
              <div class="form-row">
                <label for="memo" class="row-label">일정 내용</label>
                <div class="row-input full-width">
                  <textarea
                    id="memo"
                    name="memo"
                    rows="2"
                    placeholder="예: 정상에 올라 풍경 보기"
                  ></textarea>
                </div>
              </div>

              <!-- 기타내용 -->
              <div class="form-row">
                <label for="extraMemo" class="row-label">기타내용</label>
                <div class="row-input full-width">
                  <textarea
                    id="extraMemo"
                    name="extraMemo"
                    rows="2"
                    placeholder="추가 메모 (선택)"
                  ></textarea>
                </div>
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <p class="footer-help">
              관광지를 선택하지 않고 직접 입력할 수도 있습니다.
            </p>
            <div class="footer-actions">
              <button
                type="button"
                class="btn-outline"
                onclick="closeScheduleModal()"
              >
                취소
              </button>
              <button id="schedule-submit" type="submit" form="schedule-form" class="btn-solid">
                일정 저장
              </button>
            </div>
          </div>
        </div>
      </div>

      <script>
        const modal = document.getElementById("schedule-modal");

        function openScheduleModal(editButton) {
          const form = document.getElementById("schedule-form");
          form.reset();
          const planId = form.dataset.planId;
          form.method = "post";

          if (editButton) {
            const itemId = editButton.dataset.itemId;
            // 팝업의 '일정 수정' 버튼을 누르면 이 경로로 POST 전송합니다.
            form.action = `/plans/${planId}/items/${itemId}/edit`;
          } else {
            // 새 일정 저장 경로
            form.action = `/plans/${planId}/items`;
          }
          document.getElementById("modal-title").textContent = editButton
            ? "일정 수정"
            : "일정 추가";
          document.getElementById("schedule-submit").textContent = editButton
            ? "일정 수정"
            : "일정 저장";

          if (editButton) {
            const item = editButton.dataset;
            const fields = [
              "placeName",
              "placeAddress",
              "visitDate",
              "visitTime",
              "duration",
              "memo",
              "extraMemo",
            ];
            fields.forEach((name) => {
              form.elements.namedItem(name).value = item[name] ?? "";
            });
          }

          modal.hidden = false;
        }

        function closeScheduleModal() {
          modal.hidden = true;
        }
      </script>
    </main>
  </body>
</html>

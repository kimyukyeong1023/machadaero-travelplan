<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: pageLayout('새 계획 생성 - 마차대로', ~{::pageHead}, ~{::main})}"
>
  <head>
    <th:block th:fragment="pageHead">
      <link rel="stylesheet" th:href="@{/css/plans.css}" />
      <script th:src="@{/js/plan-form.js}" defer></script>
    </th:block>
  </head>
  <body>
    <main class="plan-form-page" th:with="values=${formData != null ? formData : planDto}">
      <div class="plan-form">
        
        <!-- 상단 컨트롤 바 -->
        <div class="plan-form-header">
          <a th:href="@{/plans}" class="btn-back">&larr; 내 계획 목록</a>
          <div class="header-actions">
            <form id="create-plan-form" th:if="${planDto == null}" th:action="@{/plans}" method="post" style="display: inline;">
              <button type="submit" class="btn-submit">계획 만들기</button>
            </form>
            <form id="edit-plan-form" th:if="${planDto != null}" th:action="@{/plans/{planId}/edit(planId=${planDto.id})}" method="post" style="display: inline;">
              <button type="submit" class="btn-submit">수정</button>
            </form>
            <button type="button" class="btn-cancel" onclick="location.href='/plans'">취소</button>
          </div>
        </div>

        <!-- 중앙 입력 영역 -->
        <div class="plan-form-body">
          <h2 th:text="${planDto != null ? '여행계획 수정' : '새 여행계획'}">새 여행계획</h2>
          <p class="form-error" th:if="${errorMessage != null}" th:text="${errorMessage}" role="alert"></p>
          <div class="form-group">
            <label for="title">제목 <span class="required">*</span></label>
            <input type="text" id="title" name="title" th:attr="form=${planDto != null ? 'edit-plan-form' : 'create-plan-form'}" th:value="${values != null ? values.title : ''}" placeholder="여행 제목을 입력하세요" required autofocus />
          </div>

          <div class="form-group">
            <label>여행 기간 (선택)</label>
            <div class="date-range">
              <input type="date" id="startDate" aria-label="출발일" name="startDate" th:attr="form=${planDto != null ? 'edit-plan-form' : 'create-plan-form'}" th:value="${values != null and values.startDate != null ? #temporals.format(values.startDate, 'yyyy-MM-dd') : ''}" />
              <span>~</span>
              <input type="date" id="endDate" aria-label="종료일" name="endDate" th:attr="form=${planDto != null ? 'edit-plan-form' : 'create-plan-form'}" th:value="${values != null and values.endDate != null ? #temporals.format(values.endDate, 'yyyy-MM-dd') : ''}" />
            </div>
            <p class="help-text">기간은 나중에 입력할 수 있습니다.</p>
          </div>
        </div>
      </div>

      <!-- Codex 수정: 새 계획은 저장 안내를, 기존 계획 수정 시에는 해당 계획의 일정을 읽기 전용으로 표시합니다. -->
      <section class="schedule-preview-section">
        <div class="section-heading">
          <h3>전체 일정</h3>
        </div>

        <!-- Codex 수정: 아직 저장하지 않은 계획에는 조회할 일정이 없으므로 안내만 표시합니다. -->
        <div class="schedule-empty-box" th:if="${planDto == null}">
          <p>계획을 먼저 저장하면 일정을 추가할 수 있습니다.</p>
        </div>

        <th:block th:if="${planDto != null}">
          <!-- Codex 수정: 일정이 없는 상태와 등록된 일정이 있는 상태를 구분합니다. -->
          <div class="schedule-empty-box" th:if="${#lists.isEmpty(planItemList)}">
            <p>등록된 일정이 없습니다.</p>
          </div>

          <div class="schedule-list-container" th:unless="${#lists.isEmpty(planItemList)}">
            <div class="schedule-header list-header">
              <span class="col-order">순서</span>
              <span class="col-s-date">방문 날짜</span>
              <span class="col-place">방문 장소</span>
              <span class="col-memo">일정 내용</span>
            </div>
            <!-- Codex 수정: 서버가 전달한 일정 목록을 반복 출력합니다. 입력칸이나 일정 변경 버튼은 두지 않습니다. -->
            <ul class="schedule-list">
              <li class="schedule-item" th:each="planItem : ${planItemList}">
                <span class="col-order" th:text="${planItem.sortOrder}">1</span>
                <span class="col-s-date"
                      th:text="${planItem.visitDate != null ? #temporals.format(planItem.visitDate, 'yyyy.MM.dd') : '미정'}">미정</span>
                <span class="col-place" th:text="${planItem.placeName}">방문 장소</span>
                <span class="col-memo" th:text="${#strings.isEmpty(planItem.memo) ? '-' : planItem.memo}">일정 내용</span>
              </li>
            </ul>
          </div>
          <p class="help-text-bottom">일정은 확인용입니다. 일정 추가·수정·삭제는 '일정 보기' 화면에서 할 수 있습니다.</p>
        </th:block>
      </section>
    </main>
  </body>
</html>

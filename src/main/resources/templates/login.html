<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: pageLayout('로그인 - 마차대로', ~{::pageHead}, ~{::main})}"
>
  <head>
    <th:block th:fragment="pageHead">
      <link rel="stylesheet" th:href="@{/css/login.css}" />
      <style>
        .login-page .signup-success {
          margin: 0 0 1rem;
          padding: .75rem 1rem;
          border: 1px solid #c6d8bd;
          border-radius: .5rem;
          background: #f0f6ec;
          color: #36532b;
          font-size: .875rem;
          line-height: 1.6;
        }
        .signup-prompt {
          margin: 1rem 0 0;
          text-align: center;
          font-size: 0.875rem;
          color: var(--muted);
        }
        .signup-open {
          padding: 0.25rem 0.5rem;
          border: 0;
          background: transparent;
          color: var(--olive);
          font: inherit;
          font-weight: 600;
          text-decoration: underline;
          cursor: pointer;
        }
        .signup-dialog {
          width: 26rem;
          max-width: calc(100vw - 2rem);
          max-height: calc(100dvh - 2rem);
          box-sizing: border-box;
          overflow-y: auto;
          padding: 1.5rem;
          border: 1px solid var(--line);
          border-radius: 0.75rem;
          color: var(--text);
          background: var(--surface);
        }
        .signup-dialog::backdrop {
          background: rgba(0, 0, 0, 0.45);
        }
        .signup-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 1rem;
          margin-bottom: 1.25rem;
        }
        .signup-header h2 {
          margin: 0;
          color: var(--heading);
          font-size: 1.35rem;
        }
        .signup-close {
          padding: 0.4rem 0.6rem;
          border: 1px solid var(--line);
          border-radius: 0.4rem;
          background: var(--surface);
          color: var(--text);
          font: inherit;
          cursor: pointer;
        }
        .signup-fields {
          display: grid;
          gap: 0.5rem;
        }
        .signup-fields label {
          font-size: 0.9rem;
          font-weight: 600;
        }
        .signup-fields label:not(:first-child) {
          margin-top: 0.5rem;
        }
        .signup-fields input {
          width: 100%;
          min-width: 0;
          box-sizing: border-box;
          padding: 0.75rem;
          border: 1px solid var(--line);
          border-radius: 0.5rem;
          color: var(--text);
          background: var(--surface);
          font: inherit;
        }
        .signup-terms {
          margin-top: 1.25rem;
        }
        .signup-terms h3 {
          margin: 0 0 0.5rem;
          font-size: 0.9rem;
        }
        .signup-terms p {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 7rem;
          margin: 0;
          padding: 1rem;
          border: 1px solid var(--line);
          border-radius: 0.5rem;
          color: var(--muted);
          font-size: 0.875rem;
        }
        .signup-submit {
          width: 100%;
          margin-top: 1.25rem;
          padding: 0.8rem;
          border: 1px solid var(--olive);
          border-radius: 0.5rem;
          background: var(--olive);
          color: white;
          font: inherit;
          font-weight: 600;
          cursor: pointer;
        }
      </style>
    </th:block>
  </head>
  <body>
    <main class="login-page">
      <section class="login-box">
        <h1>로그인</h1>
        <p class="signup-success"
           th:if="${signupMsg != null}"
           th:text="${signupMsg}"
           role="status"></p>
        <!-- Codex 작성: 로그인 취소·state 만료·외부 API 오류를 같은 화면에서 안내합니다. -->
        <p
          class="login-error"
          th:if="${loginError != null}"
          th:text="${loginError}"
          role="alert"
        ></p>

        <!-- 1. 소셜 로그인 -->
        <div class="social-login">
          <!-- Codex 수정: 세 제공사의 버튼은 로그인 시작 경로에 연결합니다. state 생성은 서버에서 처리합니다. -->
          <a class="image-button kakao-login" th:href="@{/login/kakao}">
            <img
              th:src="@{/images/login/kakao-login.png}"
              alt="카카오 로그인"
            />
          </a>

          <a class="image-button" th:href="@{/login/naver}">
            <img
              th:src="@{/images/login/naver-login.png}"
              alt="네이버 로그인"
            />
          </a>

          <a class="google-login" th:href="@{/login/google}">
            <img th:src="@{/images/login/google-logo.png}" alt="" />
            <span>Google로 로그인</span>
          </a>
        </div>

        <p class="login-divider">또는</p>

        <!-- 2. 아이디 로그인: 아직 서버로 전송하지 않음 -->
        <form action="/local/login" method="post">
          <div class="id-login">
            <label for="login-id">아이디</label>
            <input
              id="login-id"
              type="text"
              name="userLocalId"
              autocomplete="username"
              placeholder="아이디 입력"
            />

            <label for="login-password">비밀번호</label>
            <input
              id="login-password"
              type="password"
              name="userLocalPassword"
              autocomplete="current-password"
              placeholder="비밀번호 입력"
            />

            <button type="submit" >로그인</button>
          </div>
        </form>

        <!-- Codex 수정: 소셜 로그인 버튼 연결에 맞춰 미구현인 아이디 로그인만 안내합니다. -->
        <p class="login-notice">아이디 로그인은 준비 중입니다.</p>
        <p class="signup-prompt">
          아직 계정이 없으신가요?
          <button class="signup-open" id="signup-open" type="button">
            회원가입
          </button>
        </p>
      </section>

      <dialog
        class="signup-dialog"
        id="signup-dialog"
        aria-labelledby="signup-title"
      >
        <form action="/signup" method="post">
          <div class="signup-header">
            <h2 id="signup-title">회원가입</h2>
            <button
              class="signup-close"
              id="signup-close"
              type="button"
              aria-label="회원가입 창 닫기"
            >
              닫기
            </button>
          </div>
          <div class="signup-fields">
            <label for="signup-id">아이디</label>
            <input
              id="signup-id"
              name="userLocalId"
              type="text"
              autocomplete="username"
              placeholder="아이디 입력"
              autofocus
            />
            <label for="signup-password">비밀번호</label>
            <input
              id="signup-password"
              name="userLocalPassword"
              type="password"
              autocomplete="new-password"
              placeholder="비밀번호 입력"
            />
          </div>
          <section class="signup-terms" aria-labelledby="signup-terms-title">
            <h3 id="signup-terms-title">약관</h3>
            <p>약관 들어갈 자리</p>
          </section>
          <!-- 화면 구성용 버튼: 회원가입 처리는 추후 연결합니다. -->
          <button class="signup-submit" type="submit">회원가입하기</button>
        </form>
      </dialog>

      <script>
        (() => {
          const dialog = document.getElementById("signup-dialog");
          document
            .getElementById("signup-open")
            .addEventListener("click", () => dialog.showModal());
          document
            .getElementById("signup-close")
            .addEventListener("click", () => dialog.close());
        })();
      </script>
    </main>
  </body>
</html>

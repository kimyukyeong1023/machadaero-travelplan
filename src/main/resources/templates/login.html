<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pageLayout('로그인 - 마차대로', ~{::pageHead}, ~{::main})}">
  <head>
    <th:block th:fragment="pageHead">
      <link rel="stylesheet" th:href="@{/css/login.css}" />
    </th:block>
  </head>
  <body>
    <main class="login-page">
      <section class="login-box">
        <h1>로그인</h1>
        <!-- Codex 작성: 로그인 취소·state 만료·외부 API 오류를 같은 화면에서 안내합니다. -->
        <p class="login-error" th:if="${loginError != null}" th:text="${loginError}" role="alert"></p>

        <!-- 1. 소셜 로그인 -->
        <div class="social-login">

          <!-- Codex 수정: 세 제공사의 버튼은 로그인 시작 경로에 연결합니다. state 생성은 서버에서 처리합니다. -->
          <a class="image-button kakao-login" th:href="@{/login/kakao}">
            <img th:src="@{/images/login/kakao-login.png}" alt="카카오 로그인" />
          </a>

          <a class="image-button" th:href="@{/login/naver}">
            <img th:src="@{/images/login/naver-login.png}" alt="네이버 로그인" />
          </a>

          <a class="google-login" th:href="@{/login/google}">
            <img th:src="@{/images/login/google-logo.png}" alt="" />
            <span>Google로 로그인</span>
          </a>
        </div>

        <p class="login-divider">또는</p>

        <!-- 2. 아이디 로그인: 아직 서버로 전송하지 않음 -->
        <div class="id-login">
          <label for="login-id">아이디</label>
          <input id="login-id" type="text" autocomplete="username"
                 placeholder="아이디 입력" />

          <label for="login-password">비밀번호</label>
          <input id="login-password" type="password" autocomplete="current-password"
                 placeholder="비밀번호 입력" />

          <button type="button" disabled>로그인</button>
        </div>

        <!-- Codex 수정: 소셜 로그인 버튼 연결에 맞춰 미구현인 아이디 로그인만 안내합니다. -->
        <p class="login-notice">아이디 로그인은 준비 중입니다.</p>
      </section>
    </main>
  </body>
</html>

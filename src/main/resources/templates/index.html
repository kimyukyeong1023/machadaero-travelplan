
<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: pageLayout('마차대로', ~{::pageHead}, ~{::main})}"
>
  <head>
    <th:block th:fragment="pageHead">
      <link rel="stylesheet" th:href="@{/css/index.css}" />
      <script th:src="@{/js/place-pagination.js}" defer></script>
      <script th:src="@{/js/place.js}" defer></script>
      <!-- Codex 추가: 메인의 계획 카드에 분류와 정렬을 적용합니다. -->
      <script th:src="@{/js/home-plans.js}" defer></script>
    </th:block>
  </head>
  <body>
    <main class="home-page">
      <!-- 1. 검색 영역 -->
      <section id="place-search" class="search-area">
        <div class="search-filters">
          <!-- Codex 수정: 법정동 시도 코드를 전송하고 검색 후 선택값을 유지합니다.
         form 속성으로 아래 검색 폼에 연결해 기존 HTML 배치를 유지합니다. -->
          <select aria-label="관광 지역" name="lDongRegnCd" form="place-search-form">
            <option
              value=""
              th:selected="${lDongRegnCd == null or lDongRegnCd == ''}"
            >
              지역 전체
            </option>
            <option value="11" th:selected="${lDongRegnCd == '11'}">
              서울
            </option>
            <option value="26" th:selected="${lDongRegnCd == '26'}">
              부산
            </option>
            <option value="27" th:selected="${lDongRegnCd == '27'}">
              대구
            </option>
            <option value="28" th:selected="${lDongRegnCd == '28'}">
              인천
            </option>
            <option value="29" th:selected="${lDongRegnCd == '29'}">
              광주
            </option>
            <option value="30" th:selected="${lDongRegnCd == '30'}">
              대전
            </option>
            <option value="31" th:selected="${lDongRegnCd == '31'}">
              울산
            </option>
            <option value="36" th:selected="${lDongRegnCd == '36'}">
              세종
            </option>
            <option value="41" th:selected="${lDongRegnCd == '41'}">
              경기
            </option>
            <option value="51" th:selected="${lDongRegnCd == '51'}">
              강원
            </option>
            <option value="43" th:selected="${lDongRegnCd == '43'}">
              충북
            </option>
            <option value="44" th:selected="${lDongRegnCd == '44'}">
              충남
            </option>
            <option value="52" th:selected="${lDongRegnCd == '52'}">
              전북
            </option>
            <option value="46" th:selected="${lDongRegnCd == '46'}">
              전남
            </option>
            <option value="47" th:selected="${lDongRegnCd == '47'}">
              경북
            </option>
            <option value="48" th:selected="${lDongRegnCd == '48'}">
              경남
            </option>
            <option value="50" th:selected="${lDongRegnCd == '50'}">
              제주
            </option>
          </select>

          <!-- Codex 수정: 첨부된 신분류표의 대분류 코드를 전송합니다.
         value는 API 코드이고 화면에는 사용자용 분류명을 표시합니다. -->
          <select aria-label="관광 카테고리" name="lclsSystm1" form="place-search-form">
            <option
              value=""
              th:selected="${lclsSystm1 == null or lclsSystm1 == ''}"
            >
              카테고리 전체
            </option>
            <option value="NA" th:selected="${lclsSystm1 == 'NA'}">
              자연관광
            </option>
            <option value="HS" th:selected="${lclsSystm1 == 'HS'}">
              역사관광
            </option>
            <option value="VE" th:selected="${lclsSystm1 == 'VE'}">
              문화관광
            </option>
            <option value="EX" th:selected="${lclsSystm1 == 'EX'}">
              체험관광
            </option>
            <option value="LS" th:selected="${lclsSystm1 == 'LS'}">
              레저스포츠
            </option>
            <option value="AC" th:selected="${lclsSystm1 == 'AC'}">숙박</option>
            <option value="FD" th:selected="${lclsSystm1 == 'FD'}">음식</option>
            <option value="SH" th:selected="${lclsSystm1 == 'SH'}">쇼핑</option>
            <option value="EV" th:selected="${lclsSystm1 == 'EV'}">
              축제/공연/행사
            </option>
            <option value="C01" th:selected="${lclsSystm1 == 'C01'}">
              추천코스
            </option>
          </select>
        </div>

        <!-- Codex 수정: 바깥의 select 두 개를 연결하기 위해 id를 추가합니다. -->
        <form
          id="place-search-form"
          class="search-keyword"
          th:action="@{/api/places}"
          method="get"
        >
          <input
            type="text"
            name="keyword"
            aria-label="관광지 검색어"
            th:value="${keyword}"
            placeholder="키워드로 관광지 검색"
          />
          <button type="submit">검색</button>
        </form>
      </section>

      <!-- 2. 가운데 영역 -->
      <div class="content-area">
        <!-- Codex 수정: 기존 검색 안내와 검색 결과를 왼쪽 영역으로 묶습니다. -->
        <div class="place-search-panel">
          <!-- 검색 전 안내 -->
          <section class="search-guide" th:if="${pageNo == null}">
            <h2>가고 싶은 곳을 찾아 여행계획에 담아보세요</h2>
            <p>관광지 검색 → 내 계획 선택 → 계획에 추가 → 순서 정리</p>
          </section>

          <!-- 컨트롤러에서 전달한 검색 결과와 페이지 정보 표시 -->
          <!-- Codex 수정: 페이지 처리 JS가 현재 검색에 적용된 지역·카테고리를 읽도록
     data-l-dong-regn-cd와 data-lcls-systm1을 추가합니다. -->
          <section
            class="search-results"
            th:if="${pageNo != null}"
            th:attr="data-batch-no=${pageNo},
                  data-total-count=${totalCount},
                  data-keyword=${keyword},
                  data-l-dong-regn-cd=${lDongRegnCd},
                  data-lcls-systm1=${lclsSystm1},
                  data-search-url=@{/api/places}"
          >
            <h2>관광지 검색 결과</h2>
            <p class="search-count" th:text="|총 ${totalCount}건|">총 0건</p>
            <p
              class="search-empty"
              th:hidden="${!#lists.isEmpty(SearchPlaceResponseDto)}"
            >
              검색 결과가 없습니다.
            </p>

            <ul class="place-list">
              <li
                class="place-item"
                th:each="place, status : ${SearchPlaceResponseDto}"
                th:hidden="${status.index >= 5}"
              >
                <!-- Codex 수정: 검색 목록에 썸네일을 표시하고, URL이 없으면 안내 문구를 표시합니다. -->
                <div class="place-image">
                  <img
                    th:if="${!#strings.isEmpty(place.thumbnailUrl)}"
                    th:src="${place.thumbnailUrl}"
                    th:alt="${place.title}"
                    loading="lazy"
                  />

                  <span th:if="${#strings.isEmpty(place.thumbnailUrl)}">
                    이미지 없음
                  </span>
                </div>
                <div class="place-info">
                  <h3 th:text="${place.title}">관광지 이름</h3>
                  <p th:text="${place.address}">관광지 주소</p>
                </div>
                <button
                  type="button"
                  class="place-detail-button"
                  th:attr="data-contentid=${place.contentid}
                      ,data-detail-url=@{/api/places/{id}(id=${place.contentid})}"
                >
                  상세보기
                </button>
                <!-- Codex 추가: 현재 선택한 계획에 관광지 이름과 주소를 복사해서 추가합니다. -->
                <button
                  type="button"
                  class="place-add-button"
                  th:if="${session.loginUserId != null}"
                  th:attr="data-place-name=${place.title},
                 data-place-address=${place.address}"
                >
                  계획에 추가
                </button>

                <p class="detail-message" role="status"></p>
                <section
                  class="place-detail"
                  th:id="|place-detail-${place.contentid}|"
                  hidden
                >
                  <h4 class="detail-title"></h4>
                  <p class="detail-address"></p>
                  <p class="detail-overview"></p>
                </section>
              </li>
            </ul>

            <nav
              class="page-buttons"
              th:hidden="${totalCount == 0}"
              aria-label="검색 결과 페이지"
            >
              <button type="button" class="previous-pages" disabled>
                이전
              </button>
              <span class="page-numbers"></span>
              <button
                type="button"
                class="next-pages"
                th:disabled="${pageNo * numOfRows >= totalCount}"
              >
                다음
              </button>
            </nav>
            <p class="pagination-message" role="status" aria-live="polite"></p>
          </section>
        </div>
        <!-- Codex 추가: 계획 선택 시 표시할 빈 일정 영역입니다.
       실제 일정 조회와 표시는 아직 연결하지 않습니다. -->
        <!-- Codex 수정: 선택한 계획의 제목, 조회 상태, 일정 목록을 표시합니다. -->
        <!-- Codex 수정: 일정 조회와 순서 편집 버튼을 함께 표시합니다. -->
        <section
          class="selected-plan-panel"
          aria-label="선택한 계획 일정"
          aria-busy="false"
          hidden
        >
          <h2 class="selected-plan-title">선택한 계획</h2>

          <div class="selected-plan-controls">
            <button type="button" class="home-order-edit">순서 편집</button>
            <button type="button" class="home-order-save" hidden>
              순서 저장
            </button>
            <button type="button" class="home-order-cancel" hidden>취소</button>
            <button type="button" class="home-items-reload">
              목록 새로고침
            </button>
          </div>

          <p class="selected-plan-status" role="status" aria-live="polite"></p>
          <ol class="selected-plan-items"></ol>
        </section>
      </div>

      <!-- 3. 내 계획 영역: 비로그인 화면의 자리만 표시 -->
      <section class="my-plans">
        <div class="my-plans-header">
          <h2>내 계획</h2>

          <form
            th:if="${session.loginUserId != null}"
            th:action="@{/plans}"
            method="get"
          >
            <button type="submit">내 계획으로 이동</button>
          </form>
        </div>

        <!-- Codex 수정: 비로그인 상태에서는 기존 로그인 안내를 표시합니다. -->
        <div class="login-guide" th:if="${session.loginUserId == null}">
          <p>로그인하고 나만의 여행계획을 만들어보세요.</p>
          <form th:action="@{/login}" method="get">
            <button type="submit">로그인하기</button>
          </form>
        </div>

        <!-- Codex 추가: 로그인 상태에서 서버가 전달한 내 계획을 표시합니다. -->
        <!-- Codex 수정: 로그인한 사용자의 계획을 분류별 가로 카드로 표시합니다. -->
        <div class="home-plans-content" th:if="${session.loginUserId != null}">
          <!-- Codex 추가: 서버 요청 없이 받아둔 계획을 분류합니다. -->
          <div class="home-plan-tabs" role="group" aria-label="내 계획 분류">
            <button type="button" data-filter="all" aria-pressed="true">
              전체
            </button>
            <button type="button" data-filter="upcoming" aria-pressed="false">
              예정·진행 중
            </button>
            <button type="button" data-filter="past" aria-pressed="false">
              지난 여행
            </button>
            <button type="button" data-filter="undated" aria-pressed="false">
              날짜 미완성
            </button>
          </div>

          <p class="my-plans-empty" th:hidden="${!#lists.isEmpty(planList)}">
            해당 분류의 여행계획이 없습니다.
          </p>

          <!-- Codex 수정: JS가 목록을 다시 배치할 수 있도록 ul은 항상 만듭니다. -->
          <ul class="my-plan-cards">
            <li
              th:each="plan : ${planList}"
              th:attr="data-plan-id=${plan.id},
               data-start-date=${plan.startDate},
               data-end-date=${plan.endDate}"
            >
              <!-- Codex 수정: 제목과 날짜를 버튼 안에 넣어 카드 전체가 클릭되게 합니다.
         기존에 남아 있던 </a>는 제거하고 마지막에 </button>으로 닫습니다. -->
              <!-- Codex 수정: 조회·추가는 items-url, 순서 저장은 order-url을 사용합니다. -->
              <button
                type="button"
                class="my-plan-card"
                aria-pressed="false"
                th:attr="data-items-url=@{/api/plans/{planId}/items(planId=${plan.id})},
                 data-order-url=@{/plans/{planId}/items/order(planId=${plan.id})}"
              >
                <h3 th:text="${plan.title}">계획 제목</h3>

                <p>
                  <span
                    th:text="${plan.startDate != null
                        ? #temporals.format(plan.startDate, 'yyyy.MM.dd')
                        : '출발일 미정'}"
                  >
                    출발일
                  </span>
                  <span> ~ </span>
                  <span
                    th:text="${plan.endDate != null
                        ? #temporals.format(plan.endDate, 'yyyy.MM.dd')
                        : '종료일 미정'}"
                  >
                    종료일
                  </span>
                </p>
              </button>
            </li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
